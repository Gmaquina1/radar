name: Atualizar Radar e novos lotes

on:
  workflow_dispatch:
  schedule:
    # O cron do GitHub usa UTC. Executa a cada 6 horas.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: atualizar-radar
  cancel-in-progress: false

jobs:
  atualizar:
    # Impede que o commit automático provoque uma execução em loop.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      WEB_SEARCH_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Conferir arquivos essenciais
        shell: bash
        run: |
          test -f atualizar_radar_leiloes.py
          test -f indexador_lotes.py
          test -f gerar_site_github.py
          test -f executar_atualizacao_radar.py
          test -f diagnostico_radar.py
          test -f .github/workflows/atualizar-radar.yml

      - name: Verificar OpenAI Web Search
        shell: bash
        run: |
          model="${OPENAI_SEARCH_MODEL:-gpt-5-mini}"
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            key_configurada=true
            key_texto=sim
          else
            key_configurada=false
            key_texto=não
          fi
          echo "OPENAI_API_KEY_CONFIGURADA: $key_configurada"
          echo "OPENAI_SEARCH_MODEL: $model"
          if [ "$key_configurada" = false ]; then
            echo "OPENAI_WEB_SEARCH_DESATIVADA: API KEY AUSENTE"
          fi

      - name: Procurar novos leilões e novos lotes
        id: atualizar
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python executar_atualizacao_radar.py             --workers-mapa 24             --workers-lotes 16             --delay-lotes 0             2>&1 | tee atualizacao.log

      - name: Executar testes de segurança
        id: testes
        if: always()
        continue-on-error: true
        run: python -m unittest discover -v

      - name: Resumo da cobertura nacional
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json
          from pathlib import Path
          def data(name):
              try: return json.loads(Path(name).read_text())
              except Exception: return {}
          d, c = data('relatorio_descoberta_web.json'), data('relatorio_cobertura_radar.json')
          try:
              mapa = sum(1 for _ in csv.DictReader(open('radar_leiloes_eventos_futuros.csv', encoding='utf-8-sig')))
          except OSError: mapa = 0
          print('## Cobertura do Radar')
          print(f"MAPA_EVENTOS: {mapa}")
          print(f"CATALOGO_PORTAIS: {c.get('total_dominios', 0)}")
          ativa = bool(d.get('busca_web_configurada', False))
          consultas = d.get('consultas_executadas', 0)
          if isinstance(consultas, list): consultas = len(consultas)
          print(f"BUSCA WEB OPENAI: {'ATIVA' if ativa else 'INATIVA'}")
          print(f"MODELO: {d.get('modelo', 'gpt-5-mini')}")
          print(f"CONSULTAS OPENAI: {consultas}")
          print(f"RESULTADOS ENCONTRADOS: {d.get('resultados_web', 0)}")
          print(f"NOVOS DOMÍNIOS: {d.get('novos_dominios', 0)}")
          print(f"DOMINIOS_VISITADOS: {d.get('dominios_visitados', 0)}")
          print(f"EVENTOS FORA DO MAPA: {c.get('eventos_fora_do_mapa', 0)}")
          print(f"LOTES FORA DO MAPA: {c.get('LOTES_FORA_DO_MAPA', 0)}")
          if not ativa:
              print('OPENAI_WEB_SEARCH_DESATIVADA: API KEY AUSENTE')
          print(f"BLOQUEADOS: {d.get('bloqueados', 0)}")
          print(f"ERROS: {len(d.get('erros', []))}")
          print(f"DESCOBERTA_WEB_STATUS: {d.get('status', 'erro')}")
          PY

      - name: Auditar garra florestal
        if: always()
        shell: bash
        run: |
          python auditar_cobertura.py "garra florestal" | tee auditoria_garra.txt
          echo "AUDITORIA: garra florestal" >> "$GITHUB_STEP_SUMMARY"
          awk '/^NA_BASE:/ {print "RESULTADOS_NA_BASE: " $2}' auditoria_garra.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar resultado
        if: always()
        shell: bash
        run: |
          echo "===== STATUS DO RADAR ====="
          cat status_atualizacao.txt 2>/dev/null || true
          echo
          echo "===== ARQUIVOS MODIFICADOS ====="
          git status --short

      - name: Salvar atualização no GitHub
        if: steps.atualizar.outcome == 'success' && steps.testes.outcome == 'success'
        shell: bash
        run: |
          git config user.name "Radar G MÁQUINA"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "A coleta foi executada, mas nenhum arquivo mudou."
            exit 0
          fi

          git commit -m "Atualização automática do Radar - $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar relatório da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-atualizacao-radar
          path: |
            atualizacao.log
            status_atualizacao.json
            status_atualizacao.txt
            relatorio_atualizacao_lotes.json
            relatorio_descoberta_web.json
            relatorio_cobertura_radar.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Confirmar conclusão
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.atualizar.outcome }}" != "success" ]; then
            echo "A coleta apresentou erro. A base antiga foi preservada."
            exit 1
          fi

          if [ "${{ steps.testes.outcome }}" != "success" ]; then
            echo "Os testes de segurança apresentaram erro."
            exit 1
          fi

          echo "Radar atualizado com sucesso."
