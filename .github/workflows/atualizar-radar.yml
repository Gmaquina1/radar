name: Atualizar Radar e novos lotes

on:
  workflow_dispatch:
  schedule:
    # O cron do GitHub usa UTC. Executa a cada 6 horas.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/deep-discovery-trigger"

permissions:
  contents: write

concurrency:
  group: atualizar-radar
  cancel-in-progress: false

jobs:
  atualizar:
    # Impede que o commit automático provoque uma execução em loop.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      WEB_SEARCH_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL || 'gpt-5-mini' }}
      MAX_PAGES_PER_DOMAIN: "3"
      MAX_URLS_PER_DOMAIN: "15"
      MAX_DEPTH: "1"
      REQUEST_TIMEOUT: "10"
      REQUEST_RETRIES: "1"
      FAST_MAX_PORTALS: "30"
      GLOBAL_WORKERS: "6"
      DOMAIN_TIME_BUDGET: "20"
      DISCOVERY_TIME_BUDGET: "600"
      PDF_MAX_BYTES: "15000000"
      PDF_MAX_PAGES: "120"
      PDF_PARSE_TIMEOUT: "20"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Conferir arquivos essenciais
        shell: bash
        run: |
          test -f atualizar_radar_leiloes.py
          test -f indexador_lotes.py
          test -f gerar_site_github.py
          test -f executar_atualizacao_radar.py
          test -f diagnostico_radar.py
          test -f .github/workflows/atualizar-radar.yml

      - name: Registrar configuração OpenAI do modo rápido
        shell: bash
        run: |
          model="${OPENAI_SEARCH_MODEL:-gpt-5-mini}"
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            key_configurada=true
            key_texto=sim
          else
            key_configurada=false
            key_texto=não
          fi
          echo "OPENAI_API_KEY_CONFIGURADA: $key_configurada"
          echo "OPENAI_SEARCH_MODEL: $model"
          echo "OPENAI_CONNECTION: NAO_TESTADA_MODO_RAPIDO"
          echo "OPENAI_WEB_SEARCH: NAO_EXECUTADA_MODO_RAPIDO"
          if [ "$key_configurada" = false ]; then
            echo "OPENAI_WEB_SEARCH_DESATIVADA: API KEY AUSENTE"
          fi

      - name: Procurar novos leilões e novos lotes
        id: atualizar
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python executar_atualizacao_radar.py \
            --modo rapido \
            --workers-mapa 24 \
            --workers-lotes 16 \
            --delay-lotes 0 \
            2>&1 | tee atualizacao.log

      - name: Executar testes de segurança
        id: testes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python -m unittest discover -v
          python -m compileall -q .
          git diff --check

      - name: Resumo da cobertura nacional
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json
          from pathlib import Path
          def data(name):
              try: return json.loads(Path(name).read_text())
              except Exception: return {}
          d, c = data('relatorio_descoberta_web.json'), data('relatorio_cobertura_radar.json')
          try:
              mapa = sum(1 for _ in csv.DictReader(open('radar_leiloes_eventos_futuros.csv', encoding='utf-8-sig')))
          except OSError: mapa = 0
          l, s = data('relatorio_atualizacao_lotes.json'), data('status_atualizacao.json')
          print('## Radar de Leilões')
          print(f"MODO: RÁPIDO  ")
          print(f"DURAÇÃO: {s.get('duracao_segundos', 0)}s  ")
          print(f"OPENAI_CONFIGURADA: {d.get('openai_configurada', False)}  ")
          print("OPENAI_CONNECTION: NAO_TESTADA_MODO_RAPIDO  ")
          print("OPENAI_WEB_SEARCH: NAO_EXECUTADA_MODO_RAPIDO  ")
          print(f"OPENAI_MODEL: {d.get('modelo', 'gpt-5-mini')}  ")
          print(f"OPENAI_QUERIES: {d.get('consultas_executadas', 0)}  ")
          print(f"OPENAI_RESULTS: {d.get('resultados_web', 0)}  ")
          print(f"OPENAI_NEW_DOMAINS: {d.get('novos_dominios', 0)}  ")
          print(f"PORTAIS_TOTAL: {c.get('total_dominios', 0)}  ")
          print(f"PORTAIS_VISITADOS: {d.get('dominios_visitados', 0)}  ")
          print(f"PORTAIS_OK: {d.get('portais_ok', 0)}  ")
          print(f"PORTAIS_BLOQUEADOS: {d.get('bloqueados', 0)}  ")
          print(f"PORTAIS_TIMEOUT: {d.get('timeouts', 0)}  ")
          print(f"EVENTOS_MAPA: {mapa}  ")
          print(f"EVENTOS_FORA_MAPA: {c.get('eventos_fora_do_mapa', 0)}  ")
          print(f"EVENTOS_TOTAL: {c.get('total_eventos_ativos', mapa)}  ")
          print(f"LOTES_ANTES: {l.get('lotes_antes', 0)}  ")
          print(f"LOTES_DEPOIS: {l.get('lotes_depois', 0)}  ")
          print(f"LOTES_NOVOS: {l.get('lotes_realmente_novos', 0)}  ")
          print(f"LOTES_PRESERVADOS: {l.get('lotes_preservados', 0)}  ")
          print(f"LOTES_FORA_MAPA: {c.get('LOTES_FORA_DO_MAPA', 0)}  ")
          print(f"STATUS_FINAL: {s.get('status', 'erro')}")
          ativa = bool(d.get('busca_web_configurada', False))
          consultas = d.get('consultas_executadas', 0)
          if isinstance(consultas, list): consultas = len(consultas)
          if not ativa:
            print('OPENAI_WEB_SEARCH_DESATIVADA: API KEY AUSENTE')
          PY

      - name: Auditar garra florestal
        if: always()
        shell: bash
        run: |
          python auditar_cobertura.py "garra florestal" | tee auditoria_garra.txt
          echo "AUDITORIA: garra florestal" >> "$GITHUB_STEP_SUMMARY"
          awk '/^NA_BASE:/ {print "RESULTADOS_NA_BASE: " $2}' auditoria_garra.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar resultado
        if: always()
        shell: bash
        run: |
          echo "===== STATUS DO RADAR ====="
          cat status_atualizacao.txt 2>/dev/null || true
          echo
          echo "===== ARQUIVOS MODIFICADOS ====="
          git status --short

      - name: Salvar atualização no GitHub
        if: steps.atualizar.outcome == 'success' && steps.testes.outcome == 'success'
        shell: bash
        run: |
          git config user.name "Radar G MÁQUINA"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "A coleta foi executada, mas nenhum arquivo mudou."
            exit 0
          fi

          git commit -m "Atualização automática do Radar - $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar relatório da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-atualizacao-radar
          path: |
            atualizacao.log
            status_atualizacao.json
            status_atualizacao.txt
            relatorio_atualizacao_lotes.json
            relatorio_descoberta_web.json
            relatorio_cobertura_radar.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Confirmar conclusão
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.atualizar.outcome }}" != "success" ]; then
            echo "A coleta apresentou erro. A base antiga foi preservada."
            exit 1
          fi

          if [ "${{ steps.testes.outcome }}" != "success" ]; then
            echo "Os testes de segurança apresentaram erro."
            exit 1
          fi

          echo "Radar atualizado com sucesso."
