name: Atualizar Radar completo

on:
  workflow_dispatch:
  schedule:
    # O cron do GitHub usa UTC. Executa a cada 6 horas.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/deep-discovery-trigger"
      - "licitacoes.json"
      - "licitacoes.html"
      - "status_licitacoes.json"
      - "relatorio_licitacoes_openai.json"

permissions:
  contents: write

concurrency:
  group: atualizar-radar-completo
  cancel-in-progress: true

jobs:
  atualizar:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      WEB_SEARCH_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL || 'gpt-5-mini' }}

      # PNCP: coleta completa, sequencial e resiliente.
      PNCP_TIMEOUT: "75"
      PNCP_TENTATIVAS: "10"
      PNCP_TAMANHO_PAGINA: "500"
      PNCP_MAX_PAGINAS: "1000"
      PNCP_MAX_REGISTROS: "60000"
      PNCP_INTERVALO: "1.2"
      PNCP_ESPERA_429: "45"
      PNCP_ESPERA_MAXIMA: "300"
      PNCP_WORKERS: "1"

      # Fonte oficial complementar.
      COMPRAS_GOV_DIAS: "365"
      COMPRAS_GOV_TAMANHO_PAGINA: "500"
      COMPRAS_GOV_MAX_PAGINAS: "1000"
      COMPRAS_GOV_WORKERS: "1"

      # Configuração do Radar de leilões.
      MAX_PAGES_PER_DOMAIN: "3"
      MAX_URLS_PER_DOMAIN: "15"
      MAX_DEPTH: "1"
      REQUEST_TIMEOUT: "10"
      REQUEST_RETRIES: "1"
      FAST_MAX_PORTALS: "30"
      GLOBAL_WORKERS: "6"
      DOMAIN_TIME_BUDGET: "20"
      DISCOVERY_TIME_BUDGET: "600"
      PDF_MAX_BYTES: "15000000"
      PDF_MAX_PAGES: "120"
      PDF_PARSE_TIMEOUT: "20"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Conferir arquivos essenciais
        shell: bash
        run: |
          test -f atualizar_radar_leiloes.py
          test -f indexador_lotes.py
          test -f gerar_site_github.py
          test -f atualizar_licitacoes.py
          test -f atualizar_licitacoes_completo.py
          test -f licitacoes_template.html
          test -f executar_atualizacao_radar.py

      - name: Atualizar leilões e lotes
        shell: bash
        run: |
          set -o pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Publicação rápida: preservando a base atual de leilões."
            python sanitizar_conteudo_externo.py
          else
            python executar_atualizacao_radar.py \
              --modo rapido \
              --workers-mapa 24 \
              --workers-lotes 16 \
              --delay-lotes 0 \
              2>&1 | tee atualizacao.log
          fi

      - name: Captar todas as licitações abertas
        shell: bash
        run: |
          python atualizar_licitacoes_completo.py 2>&1 | tee atualizacao_licitacoes.log

      - name: Gerar páginas do site
        shell: bash
        run: |
          python gerar_site_github.py

      - name: Validar coleta antes da publicação
        shell: bash
        run: |
          python -m compileall -q atualizar_licitacoes_completo.py atualizar_licitacoes.py gerar_site_github.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('licitacoes.json').read_text(encoding='utf-8'))
          status = json.loads(Path('status_licitacoes.json').read_text(encoding='utf-8'))
          rows = payload.get('licitacoes', [])

          assert isinstance(rows, list), 'Lista de licitações inválida'
          assert payload.get('total') == len(rows), 'Total divergente'
          assert rows, 'Nenhuma licitação captada'
          assert status.get('paginas_pncp_informadas', 0) > 0, 'PNCP não informou páginas'
          assert status.get('paginas_pncp_informadas', 0) <= 1000, 'Limite de páginas insuficiente'
          assert not status.get('erros_pncp'), 'Uma ou mais páginas do PNCP não foram coletadas'
          assert status.get('status') == 'ok', 'Coleta do PNCP ainda parcial'
          assert Path('licitacoes.html').stat().st_size > 1000, 'Página de licitações não gerada'

          print(f"LICITACOES_TOTAL={len(rows)}")
          print(f"PNCP={status.get('fontes', {}).get('pncp', 0)}")
          print(f"COMPRAS_GOV={status.get('fontes', {}).get('compras_gov', 0)}")
          print(f"PAGINAS_PNCP={status.get('paginas_pncp_informadas', 0)}")
          print(f"TAMANHO_PAGINA={status.get('tamanho_pagina_pncp', 0)}")
          PY
          git diff --check

      - name: Publicar atualização no GitHub
        shell: bash
        run: |
          git config user.name "Radar de Oportunidades"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhum arquivo mudou."
            exit 0
          fi

          git commit -m "Publicar todas as licitações abertas - $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-radar-completo
          path: |
            atualizacao.log
            atualizacao_licitacoes.log
            status_licitacoes.json
            status_atualizacao.json
          if-no-files-found: ignore
          retention-days: 14
