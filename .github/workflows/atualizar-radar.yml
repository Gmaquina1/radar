name: Atualizar Radar completo

on:
  workflow_dispatch:
  schedule:
    # O cron do GitHub usa UTC. Executa a cada 6 horas.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/deep-discovery-trigger"
      - "licitacoes.json"
      - "licitacoes.html"
      - "status_licitacoes.json"
      - "relatorio_licitacoes_openai.json"

permissions:
  contents: write

concurrency:
  group: atualizar-radar-completo
  cancel-in-progress: true

jobs:
  atualizar:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      WEB_SEARCH_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL || 'gpt-5-mini' }}

      # Configuração do Radar de leilões.
      MAX_PAGES_PER_DOMAIN: "3"
      MAX_URLS_PER_DOMAIN: "15"
      MAX_DEPTH: "1"
      REQUEST_TIMEOUT: "10"
      REQUEST_RETRIES: "1"
      FAST_MAX_PORTALS: "30"
      GLOBAL_WORKERS: "6"
      DOMAIN_TIME_BUDGET: "20"
      DISCOVERY_TIME_BUDGET: "600"
      PDF_MAX_BYTES: "15000000"
      PDF_MAX_PAGES: "120"
      PDF_PARSE_TIMEOUT: "20"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Conferir arquivos essenciais
        shell: bash
        run: |
          test -f atualizar_radar_leiloes.py
          test -f indexador_lotes.py
          test -f gerar_site_github.py
          test -f atualizar_licitacoes.py
          test -f atualizar_licitacoes_completo.py
          test -f licitacoes_template.html
          test -f executar_atualizacao_radar.py

      - name: Atualizar leilões e lotes
        shell: bash
        run: |
          set -o pipefail
          python executar_atualizacao_radar.py \
            --modo rapido \
            --workers-mapa 24 \
            --workers-lotes 16 \
            --delay-lotes 0 \
            2>&1 | tee atualizacao.log

      - name: Gerar páginas do site
        shell: bash
        run: |
          python gerar_site_github.py

      - name: Validar coleta antes da publicação
        shell: bash
        run: |
          python -m compileall -q atualizar_licitacoes_completo.py atualizar_licitacoes.py gerar_site_github.py
          python - <<'PY'
          from pathlib import Path

          assert Path('leiloes.html').stat().st_size > 100000, 'Página de leilões não gerada'
          assert 'id="radar-data"' in Path('leiloes.html').read_text(encoding='utf-8', errors='replace'), 'Base de leilões não embutida'

          print('RADAR_LEILOES_VALIDADO=1')
          PY
          git diff --check

      - name: Publicar atualização no GitHub
        shell: bash
        run: |
          git config user.name "Radar de Leilões"
          git config user.email "actions@users.noreply.github.com"

          # As licitações possuem workflow próprio. Restaurá-las aqui impede
          # conflitos quando os dois coletores terminam em horários próximos.
          git restore --source=HEAD --worktree -- \
            licitacoes.json \
            licitacoes.html \
            status_licitacoes.json \
            relatorio_licitacoes_openai.json

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhum arquivo mudou."
            exit 0
          fi

          git commit -m "Atualizar Radar de Leilões - $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-radar-completo
          path: |
            atualizacao.log
            status_licitacoes.json
            status_atualizacao.json
          if-no-files-found: ignore
          retention-days: 14
