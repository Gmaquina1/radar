name: Atualizar Licitações - Coleta Completa

on:
  workflow_dispatch:
  schedule:
    # Executa 30 minutos depois do Radar principal para evitar disputa com a API.
    - cron: "47 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atualizar-licitacoes-completo.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-licitacoes-completo
  cancel-in-progress: true

jobs:
  coletar:
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      # O PNCP aceita até 500 registros por página. Uma única requisição por vez
      # evita o bloqueio 429 que ocorria com 16 chamadas simultâneas.
      PNCP_TEMPO_MAXIMO: "3600"
      PNCP_TIMEOUT: "60"
      PNCP_TENTATIVAS: "6"
      PNCP_TAMANHO_PAGINA: "500"
      PNCP_MAX_PAGINAS: "200"
      PNCP_MAX_REGISTROS: "60000"
      PNCP_WORKERS: "1"
      PNCP_PUBLICACAO_DIAS: "365"
      PNCP_PUBLICACAO_JANELA: "7"
      PNCP_PUBLICACAO_MAX_PAGINAS: "200"
      COMPRAS_GOV_DIAS: "365"
      COMPRAS_GOV_TAMANHO_PAGINA: "500"
      COMPRAS_GOV_MAX_PAGINAS: "200"
      COMPRAS_GOV_WORKERS: "2"

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tzdata

      - name: Captar licitações abertas
        shell: bash
        run: |
          python atualizar_licitacoes.py
          python gerar_site_github.py

      - name: Validar arquivos gerados
        shell: bash
        run: |
          python -m compileall -q atualizar_licitacoes.py gerar_site_github.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('licitacoes.json').read_text(encoding='utf-8'))
          rows = payload.get('licitacoes', [])
          assert isinstance(rows, list), 'Lista de licitações inválida'
          assert payload.get('total') == len(rows), 'Total divergente'
          assert len(rows) > 0, 'A coleta não retornou licitações'
          assert Path('licitacoes.html').stat().st_size > 1000, 'Página de licitações não foi gerada'
          print(f"Licitações captadas: {len(rows)}")
          PY
          git diff --check

      - name: Publicar no site
        shell: bash
        run: |
          git config user.name "Radar de Oportunidades"
          git config user.email "actions@users.noreply.github.com"
          git add licitacoes.json licitacoes.html status_licitacoes.json relatorio_licitacoes_openai.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base de licitações."
            exit 0
          fi

          git commit -m "Atualizar base completa de licitações"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Resumo da coleta
        if: always()
        shell: bash
        run: |
          cat status_licitacoes.json 2>/dev/null || true
